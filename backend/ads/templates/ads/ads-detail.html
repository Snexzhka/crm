{% extends "_base.html" %}

{% block content %}
<h2 class="fw-bold">Детальная информация о рекламной компании</h2>
<div class="row bg-white px-3 py-3 mx-2 my-5 rounded pb-5 shadow-lg">
    <div class="col"></div>
    <div class="col">
        <div class="card border-dark shadow" style="background: #eee">
            <div class="card-body">
                <h5 class="card-title fw-bold">{{ object.name }}</h5>
                <p class="card-text">{{ object.products.name }}</p>
                <div class="d-flex justify-content-end fw-bold">{{ object.budget }}руб</div>
                <div class="d-flex justify-content-center fw-bold gap-4">
                    <a href="/ads/{{ object.pk }}/edit" class="btn btn-primary">Редактировать</a>
                    <a href="/ads/{{ object.pk }}/delete" class="btn btn-danger">Удалить</a>
                </div>
            </div>
        </div>
    </div>
    <div class="col"></div>
    <div class="d-flex justify-content fw-bold">
        <a href="/ads/" class="btn btn-primary">Назад</a>
    </div>
</div>
{% endblock %}
